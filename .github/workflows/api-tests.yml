name: API Tests (Newman)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  newman:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Newman
        run: npm ci

      - name: Install and reset SUT backend
        working-directory: ../HW2/testing-seminar-eshop-sut/backend
        run: |
          npm ci
          npm run reset-db
        continue-on-error: true

      - name: Clone SUT if not present (standalone repo)
        if: failure()
        run: |
          git clone --depth 1 https://github.com/Donavfulish/testing-seminar-eshop-sut.git /tmp/sut
          cd /tmp/sut/backend && npm ci && npm run reset-db

      - name: Start backend
        run: |
          if [ -d "../HW2/testing-seminar-eshop-sut/backend" ]; then
            cd ../HW2/testing-seminar-eshop-sut/backend
          else
            cd /tmp/sut/backend
          fi
          npm start &
          sleep 5

      - name: Health check
        run: curl -f http://localhost:3000/api/products

      - name: Run API1 Profile tests
        run: npm run test:api1
        continue-on-error: true

      - name: Run API2 Order State tests
        run: npm run test:api2
        continue-on-error: true

      - name: Run API3 Admin Orders tests
        run: npm run test:api3
        continue-on-error: true

      - name: Upload Newman reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-reports
          path: |
            results/api1/newman-report.html
            results/api2/newman-report.html
            results/api3/newman-report.html
