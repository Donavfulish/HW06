name: API Tests (Newman)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  newman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout HW06
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Newman
        run: npm ci

      - name: Clone SUT (EShop backend)
        run: |
          git clone --depth 1 https://github.com/Donavfulish/eshop-sut-hw02.git /tmp/eshop-sut
          cd /tmp/eshop-sut/backend
          npm ci
          npm run reset-db

      - name: Start backend
        working-directory: /tmp/eshop-sut/backend
        run: |
          npm start &
          echo $! > /tmp/eshop-backend.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/products >/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          exit 1

      - name: Health check
        run: curl -sf http://localhost:3000/api/products | head -c 200

      - name: Prepare results folders
        run: mkdir -p results/api1 results/api2 results/api3

      - name: Run API1 Profile tests
        run: npm run test:api1
        continue-on-error: true

      - name: Run API2 Order State tests
        run: npm run test:api2
        continue-on-error: true

      - name: Run API3 Admin Orders tests
        run: npm run test:api3
        continue-on-error: true

      # For HW06 rubric: one sample commit must show a RED pipeline.
      # Trigger by commit message containing "demo failing".
      - name: Demo failing assertion (rubric sample)
        if: contains(github.event.head_commit.message, 'demo failing')
        run: |
          echo "Intentional fail demo for CI/CD report (HW06)."
          exit 1

      - name: Upload Newman reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-reports
          path: |
            results/api1/newman-report.html
            results/api2/newman-report.html
            results/api3/newman-report.html
          if-no-files-found: warn
